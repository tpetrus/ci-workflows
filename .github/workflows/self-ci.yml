name: Self CI

# This repo's own quality gates. It has no built web app and no build-dir, so this does not call the reusable
# node-ci.yml (that workflow assumes both); it is a plain, non-reusable workflow instead. Besides this repo's own
# typecheck/test, it runs actionlint and zizmor over the workflows and composite actions this repo ships to every
# other repo.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: self-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Checks out the repo, sets up Node from .nvmrc, checks the lockfile and runs npm ci.
      - uses: $/actions/setup # self repository reference: resolves at the commit of this workflow file, so a pinned release runs its own actions (see README)

      - run: npm run typecheck

      - run: npm run test

  # The only job that runs the published `ci-tools` bin the way a caller does: from inside a node_modules directory.
  # Node refuses to strip types from .ts files there, so a bin that points at .ts source passes every other check in
  # this repo (they all run the sources from a checkout) and still crashes under `npx github:...`. This is a CI job
  # rather than a vitest spec because it runs `npm pack` (which builds) and `npm install`, which takes several
  # seconds and needs the registry for the semver dependency, too slow and too network-bound for the unit suite. It
  # runs on Windows as well as Linux because the bin shim npm writes differs between them (a .cmd wrapper versus a
  # symlink to the script) and callers use both.
  installed-package:
    name: Installed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: $/actions/setup # self repository reference: resolves at the commit of this workflow file, so a pinned release runs its own actions (see README)

      - run: npm run verify:pack

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint has no action maintained by its own project; its docs recommend this download script over any
      # third-party action. Pinned to the v1.7.12 tag's commit, and that version is also passed explicitly, so this
      # step never silently picks up a newer actionlint release later.
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      # No arguments: actionlint finds every workflow file under .github/workflows on its own. It cannot take an
      # action.yml path as a direct CLI argument (per its own docs: "it is not supported to specify action.yml
      # directly via command line arguments"), so actions/*/action.yml is covered by the zizmor job below instead,
      # not here.
      #
      # -ignore: actionlint 1.7.12 (the latest release) predates two things this repo now uses, and both are
      # rejected as errors. Each pattern matches only its one message, so every other actionlint finding still
      # fails the job. Drop each once a release supports it.
      #  - GitHub's `$/` self repository reference: `uses: $/actions/...` is reported as "invalid format because ref
      #    is missing" (upstream rhysd/actionlint#711 and #732, open). `$/` is deliberate: it makes a composite action
      #    resolve at the commit of the workflow file using it, so a caller pinned to a release tag runs that
      #    release's actions rather than whatever is on main.
      #  - The job.workflow_repository / job.workflow_sha / job.workflow_ref properties of the job context, missing
      #    from actionlint's context schema (upstream rhysd/actionlint#671, open).
      - name: Run actionlint
        run: |
          ./actionlint -color \
            -ignore 'specifying action "\$/actions/[a-z-]+" in invalid format because ref is missing' \
            -ignore 'property "workflow_(repository|sha|ref)" is not defined in object type'

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships preinstalled on the ubuntu-latest image and runs zizmor from its own isolated venv, sidestepping
      # the "externally-managed-environment" restriction a plain `pip install` hits on Ubuntu 24.04's system Python.
      # Scans both the workflows and the composite actions: this is the one workflow in the whole system that sees
      # the actual reusable-workflow and composite-action logic, not just a thin caller of it. zizmor exits non-zero
      # as soon as it reports any finding, so no extra flag is needed to fail the job on a finding. The version is
      # pinned exactly (keep in step with security.yml); Dependabot cannot track a version inside a run: string, so
      # bump it by hand after reading the release notes.
      - name: Scan workflows and actions with zizmor
        run: pipx run zizmor==1.30.1 .github/workflows actions

  # Dogfoods the check-pins action on this repo's own workflows and actions. The self-*.yml wrappers call `@main` on
  # purpose and carry the zizmor ignore marker, so the check skips exactly those lines.
  pins:
    name: pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/actions/check-pins # self repository reference: resolves at the commit of this workflow file, so a pinned release runs its own actions (see README)
        with:
          paths: .github/workflows actions
