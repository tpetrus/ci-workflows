name: Security

# Reusable workflow: the caller's own wrapper workflow owns the pull_request/push/schedule triggers (and any
# concurrency group) for the run that reaches this workflow.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "CANARY_WORKFLOW_SHA=$WF_SHA workflow_ref=$WF_REF workflow_repository=$WF_REPO caller_sha=$CALLER_SHA"
        env:
          WF_SHA: ${{ job.workflow_sha }}
          WF_REF: ${{ job.workflow_ref }}
          WF_REPO: ${{ job.workflow_repository }}
          CALLER_SHA: ${{ github.sha }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: release-cli-src
          persist-credentials: false
      - run: git -C release-cli-src log -1 --format="CANARY_CHECKOUT_HEAD=%H" && ls release-cli-src/scripts/release | head -3

      - uses: $/actions/setup # self repository reference: resolves at the commit of this workflow file, so a pinned release runs its own actions (see README)

      # Production dependencies are what ships to users, so high/critical advisories block.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Dev tooling advisories are reported but do not block: they never reach the deployed bundle and are often
      # unfixable until an upstream release.
      - name: Audit all dependencies (informational)
        run: npm audit --audit-level=high
        continue-on-error: true

  dependency-review:
    # The action diffs the PR's dependency changes against the base branch, so it only makes sense on pull requests.
    # This reads the calling run's actual trigger event: workflow_call carries no event of its own, so
    # github.event_name here reflects whatever triggered the caller.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed to post the summary comment when the check fails.
      pull-requests: write
    steps:
      - uses: $/actions/setup # self repository reference: resolves at the commit of this workflow file, so a pinned release runs its own actions (see README)

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Scans the caller's own .github/workflows for Actions security issues (template injection, excessive permissions,
  # unpinned actions, etc). New compared to AV, which predates this check.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No node/npm needed for this job, so plain checkout replaces the full setup action here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships preinstalled on the ubuntu-latest image and runs zizmor from its own isolated venv, which
      # sidesteps the "externally-managed-environment" restriction a plain `pip install` hits on Ubuntu 24.04's
      # system Python. zizmor exits non-zero as soon as it reports any finding, so no extra flag is needed to fail
      # the job on a finding. The version is pinned exactly so a new zizmor release (with new audits) can never turn
      # a caller's CI red unannounced; Dependabot cannot track a version inside a run: string, so bump it by hand
      # (see the README's zizmor note) after reading the release notes.
      - name: Scan workflows with zizmor
        run: pipx run zizmor==1.30.1 .github/
