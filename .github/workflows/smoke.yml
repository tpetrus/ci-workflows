name: Smoke (production)

# Runs the `@smoke` Playwright tests against a live site. This workflow never deploys.
#
# The caller's own wrapper workflow owns the check_run/schedule/workflow_dispatch triggers and the decision of
# whether to run at all; this workflow unconditionally runs the smoke suite once invoked. Anything event-specific
# (which commit to test, which Cloudflare check gates the run) is computed by the caller and passed in below as a
# plain input, rather than this workflow reading github.event.check_run itself, so the behavior stays unambiguous
# no matter how deeply nested the call is.
on:
  workflow_call:
    inputs:
      production-url:
        type: string
        required: true
      workers-build-check:
        description: "The Cloudflare check-run name to require success from before running, e.g. 'Workers Builds: portfolio'. Only meaningful to the caller's own check_run trigger — this workflow itself doesn't filter on it, so it goes unused here; it exists so the interface documents that decision."
        type: string
        required: true
      ref:
        description: Commit to check out and test; the caller passes the check_run's head SHA when it has one, empty uses the default ref.
        type: string
        default: ''

# No concurrency group here: the caller's own wrapper workflow decides concurrency.

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: $/actions/setup # self repository reference: resolves at the commit of this workflow file, so a pinned release runs its own actions (see README)
        with:
          ref: ${{ inputs.ref }}

      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # A cache hit has the browser binary but not the OS libraries it needs, so those are always installed.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Smoke test production
        run: npm run test:smoke
        env:
          BASE_URL: ${{ inputs.production-url }}

      - name: Summarise the failure
        if: failure()
        env:
          PRODUCTION_URL: ${{ inputs.production-url }}
          COMMIT: ${{ inputs.ref != '' && inputs.ref || github.sha }}
        run: |
          {
            echo "## Production smoke test failed"
            echo
            echo "- Site: ${PRODUCTION_URL}"
            echo "- Commit: \`${COMMIT}\`"
            echo
            echo "Roll back the bad deploy by hand (this workflow never does it for you):"
            echo
            echo "- Cloudflare dashboard: Workers & Pages > (the Worker serving ${PRODUCTION_URL}) > Deployments > pick the last good version > Rollback"
            echo "- CLI: \`npx wrangler rollback\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-smoke
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
