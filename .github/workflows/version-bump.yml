name: Version bump

# Reusable workflow: the caller declares its own `pull_request_target`/`push` triggers, its own fork-safety `if:`
# check and its own `concurrency:` blocks; this file only has `on: workflow_call` and reads the same event context the
# caller's run was triggered with (a reusable workflow invoked from a `pull_request_target`-triggered run is still
# part of that run, so `github.event.pull_request` etc. are available here exactly as in the caller).
#
# The version bot. It keeps package.json and package-lock.json at the version the PR title calls for, so nobody edits
# the version by hand (ported from AudioVisualizer-React's version-bump.yml; see "Versioning and releases" in its
# AGENTS.md). It never pushes to main, because every push to main is a production deploy: it only pushes to PR
# branches.
#
# It authenticates as a GitHub App (create-github-app-token) rather than with GITHUB_TOKEN, because pushes made with
# GITHUB_TOKEN do not start workflows, and the PR's required checks would never re-run on the bot's commit.
#
# SECURITY. `pull_request_target` runs with secrets, so it must never run code from the PR. Unlike AudioVisualizer's
# version-bump.yml, there is no "checkout base branch for trusted scripts" step here: the release logic lives in the
# release-cli action, at a ref only this repo's maintainer controls, so a PR branch cannot tamper with it. bump-pr
# therefore checks out only the PR head branch, and only ever reads and edits it as text (git, jq, and the
# release-cli action's own text edits to package.json/package-lock.json) -- never npm install, never any code from
# it. Fork PRs are skipped, since the bot cannot push to them anyway.
on:
  workflow_call:
    secrets:
      RELEASE_APP_ID:
        required: true
      RELEASE_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  # A PR was opened, retitled or pushed to: make its version match its title.
  bump-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One run per PR at a time, so two quick events cannot push over each other, and nothing cancelled mid-run (a
    # title edit arriving mid-run must still be handled afterwards): the caller sets concurrency on the job that
    # calls this reusable workflow, since a reusable workflow does not declare its own.
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # The bot's own push fires `synchronize`; the version is already right by then, but skipping avoids a pointless
      # run. Human events (including a title edit) are never skipped.
      - name: Skip the bot's own events
        id: actor
        env:
          SENDER: ${{ github.event.sender.login }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ "$SENDER" = "$SLUG[bot]" ]; then
            echo "Triggered by the version bot itself; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Untrusted content: only ever read and edited as data (by git, jq and the release-cli action below), never
      # executed. No setup-node/npm-ci runs against this checkout, on purpose: the PR branch's own install/postinstall
      # scripts must never run in a job that holds the App token.
      - if: steps.actor.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token }}

      # The title is captured through the environment, never interpolated directly into a run: script or into
      # release-cli's `args:`, because GitHub substitutes ${{ }} into text before anything runs: an attacker-controlled
      # title containing backticks, `$()`, `;` or quotes could otherwise inject commands or YAML. Routing it through a
      # step output makes the later `args:` reference GitHub's own opaque output value instead of raw event text. The
      # delimiter is randomized so a title cannot smuggle a line that terminates the heredoc early.
      - name: Capture the PR title safely
        id: title
        if: steps.actor.outputs.skip != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          delim="title_$(date +%s%N)_$RANDOM"
          {
            echo "value<<$delim"
            echo "$PR_TITLE"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # BASE_REF comes from the event, so it is read through the environment too, even though it has to name an
      # existing branch. base/package.json's version comes from that trusted branch, so it is fine to reference
      # directly from here on.
      - name: Compute the base version
        id: base
        if: steps.actor.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          echo "value=$(git show "origin/$BASE_REF:package.json" | jq -r .version)" >> "$GITHUB_OUTPUT"

      # continue-on-error: an unparseable title is reported by the separate pr-title check; here it is only a reason
      # to skip writing a version, not a reason to fail this job (mirrors AV's `if ! expected=$(...); then warn; exit
      # 0; fi`).
      - name: Determine the expected version
        id: expected-version
        if: steps.actor.outputs.skip != 'true'
        continue-on-error: true
        uses: tpetrus/ci-workflows/actions/release-cli@main
        with:
          command: expected-version
          args: |
            --base-version
            ${{ steps.base.outputs.value }}
            ${{ steps.title.outputs.value }}

      - name: Warn when the title cannot be parsed
        if: steps.actor.outputs.skip != 'true' && steps.expected-version.outcome == 'failure'
        run: echo "::warning::The PR title is not a Conventional Commit, so no version was set."

      - name: Compare the PR's version
        id: compare
        if: steps.actor.outputs.skip != 'true' && steps.expected-version.outcome == 'success'
        env:
          EXPECTED: ${{ steps.expected-version.outputs.stdout }}
        run: |
          set -euo pipefail
          expected="${EXPECTED%$'\n'}"
          package_version=$(jq -r .version package.json)
          lock_version=$(jq -r .version package-lock.json)
          lock_root_version=$(jq -r '.packages[""].version' package-lock.json)
          if [ "$package_version" = "$expected" ] && [ "$lock_version" = "$expected" ] && [ "$lock_root_version" = "$expected" ]; then
            echo "Version is already $expected."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "value=$expected" >> "$GITHUB_OUTPUT"
          fi

      # expected is computed by the job itself (the CLI only ever emits a semver string), so it is fine to reference
      # directly. --dir is omitted: the PR branch was checked out at the job's default working directory.
      - name: Write the version
        if: steps.actor.outputs.skip != 'true' && steps.compare.outputs.needed == 'true'
        uses: tpetrus/ci-workflows/actions/release-cli@main
        with:
          command: write-version
          args: |
            ${{ steps.compare.outputs.value }}

      - name: Commit and push the version
        if: steps.actor.outputs.skip != 'true' && steps.compare.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED: ${{ steps.compare.outputs.value }}
        run: |
          set -euo pipefail
          bot_id=$(gh api "/users/$SLUG[bot]" --jq .id)
          git config user.name "$SLUG[bot]"
          git config user.email "$bot_id+$SLUG[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: set version to $EXPECTED"
          git push origin "HEAD:refs/heads/$HEAD_REF"

  # main moved (a PR merged and possibly released): bring every open PR branch up to date and re-derive its version,
  # because a PR's expected version depends on main's current version. Without this the "branch must be up to date"
  # rule would leave every other PR stuck until someone merged main by hand.
  sync-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Full history and the app token, so branches can be merged and pushed. This is the caller's own main branch at
      # the pushed commit, so it is trusted; the PR branches merged into it below are only ever edited as data. A
      # plain checkout (not the `setup` action, which has no `path:` input) is used here, at an explicit path, so it
      # sits beside the release-cli-src checkout below rather than nested inside it -- nothing else in this job needs
      # the caller's own node_modules, since no local script runs against the caller's checkout any more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: repo
          token: ${{ steps.app.outputs.token }}

      # The release-cli action cannot be invoked from inside the shell loop below (a composite action is a workflow
      # step, not a shell command), so its source is checked out here instead, at the same trusted, maintainer-only
      # ref the action itself uses. Unlike AV's "copy scripts/release to $RUNNER_TEMP and symlink node_modules"
      # workaround, this is an independent checkout, sitting beside (not inside) the caller's own checkout above: the
      # loop's repeated `git checkout -B pr-$number ...` swaps the *caller's* working tree, never this one, so the
      # release logic stays available and unaffected throughout.
      - name: Check out the release-cli source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tpetrus/ci-workflows
          ref: main
          path: release-cli-src
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: release-cli-src/.nvmrc

      - name: Install the release-cli source's dependencies
        working-directory: release-cli-src
        run: npm ci --ignore-scripts

      - name: Update open pull requests
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          bot_id=$(gh api "/users/$SLUG[bot]" --jq .id)
          git config user.name "$SLUG[bot]"
          git config user.email "$bot_id+$SLUG[bot]@users.noreply.github.com"
          git config merge.conflictStyle merge

          cli="$GITHUB_WORKSPACE/release-cli-src/scripts/release/cli.ts"

          # Marker that makes the conflict comment post only once per PR.
          marker='<!-- version-bot:merge-conflict -->'

          git fetch --no-tags origin main
          main_version=$(git show origin/main:package.json | jq -r .version)

          gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "'"$REPO"'") | [.number, .head.ref, .title] | @tsv' |
          while IFS=$'\t' read -r number ref title; do
            echo "::group::PR #$number ($ref)"
            git fetch --no-tags origin "$ref" || { echo "Could not fetch $ref; skipping."; echo "::endgroup::"; continue; }
            git checkout --quiet --force -B "pr-$number" "origin/$ref"

            if ! git merge --no-edit origin/main; then
              conflicted=$(git diff --name-only --diff-filter=U)
              resolvable=true
              for file in $conflicted; do
                case "$file" in
                  package.json | package-lock.json) ;;
                  *) resolvable=false ;;
                esac
              done
              if [ "$resolvable" = true ]; then
                for file in $conflicted; do
                  node "$cli" resolve-conflicts "$file" || resolvable=false
                done
              fi
              if [ "$resolvable" = true ]; then
                git add package.json package-lock.json
                git commit --no-edit
              else
                git merge --abort
                echo "::warning::PR #$number conflicts with main beyond the version lines; left for a human."
                # grep -c exits 1 when it counts no match, and the runner's bash -e would end the whole step there
                # (before the comment is posted and before later PRs are synced), so a zero count must not fail.
                existing=$(gh api --paginate "repos/$REPO/issues/$number/comments" --jq '.[].body' | grep -cF "$marker" || true)
                if [ "${existing:-0}" -eq 0 ]; then
                  gh api "repos/$REPO/issues/$number/comments" -f body="$marker
          The version bot could not merge \`main\` into this branch because of conflicts beyond the version lines. Please merge or rebase \`main\` yourself and resolve them; the bot will set the version afterwards." > /dev/null
                fi
                echo "::endgroup::"
                continue
              fi
            fi

            if expected=$(node "$cli" expected-version --base-version "$main_version" "$title"); then
              package_version=$(jq -r .version package.json)
              lock_version=$(jq -r .version package-lock.json)
              lock_root_version=$(jq -r '.packages[""].version' package-lock.json)
              if [ "$package_version" != "$expected" ] || [ "$lock_version" != "$expected" ] || [ "$lock_root_version" != "$expected" ]; then
                node "$cli" write-version "$expected"
                git add package.json package-lock.json
                git commit -m "chore: set version to $expected"
              fi
            else
              echo "::warning::PR #$number has a title that is not a Conventional Commit; version not set."
            fi

            if [ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$ref")" ]; then
              git push origin "HEAD:refs/heads/$ref" || echo "::warning::Could not push to $ref; it will be retried on the next push to main."
            else
              echo "Already up to date."
            fi
            echo "::endgroup::"
          done
