name: Setup
description: Checks out the caller's repository, sets up Node from .nvmrc, checks the lockfile, and runs npm ci.

inputs:
  fetch-depth:
    description: Number of commits to fetch (passed through to actions/checkout).
    required: false
    default: '1'
  ref:
    description: Git ref to check out (passed through to actions/checkout). Empty uses actions/checkout's default.
    required: false
    default: ''
  persist-credentials:
    description: >-
      Whether to leave the checkout credential on disk for a later git push (passed through to actions/checkout).
      Most callers only read the repository, so this defaults to false; a caller that pushes a commit back (e.g.
      update-snapshots.yml) must opt in explicitly.
    required: false
    default: 'false'
  npm-ci-args:
    description: Extra arguments appended to npm ci, e.g. --ignore-scripts.
    required: false
    default: ''
  lockfile-path:
    description: Path to the lockfile to check.
    required: false
    default: package-lock.json

runs:
  using: composite
  steps:
    - run: echo "CANARY_MARKER_7f3a9c action_path=$GITHUB_ACTION_PATH action_ref=$ACTION_REF action_repository=$ACTION_REPO"
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: ${{ inputs['fetch-depth'] }}
        ref: ${{ inputs.ref }}
        persist-credentials: ${{ inputs['persist-credentials'] }}

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
        cache: npm

    # check-lockfile.ts lives at this action's own repo root (scripts/check-lockfile.ts), not in the caller's
    # checkout, so it must be run from the action's own path rather than a path relative to the caller's working
    # directory. Use the $GITHUB_ACTION_PATH shell variable, not the ${{ github.action_path }} expression: the
    # expression is substituted as literal text by the Actions service before the runner starts the step, so in a
    # job with `container:` it still contains the host-side path, not the container-side path the step actually
    # runs in (the runner execs every step, including composite-action steps, into the container). The
    # environment variable is set by the runner itself at exec time and is translated to the container-side path
    # (see https://github.com/actions/runner/issues/2185). This action lives at actions/setup/, so ../.. reaches
    # that repo root.
    - run: node "$GITHUB_ACTION_PATH/../../scripts/check-lockfile.ts" "$LOCKFILE_PATH"
      shell: bash
      env:
        LOCKFILE_PATH: ${{ inputs['lockfile-path'] }}

    - run: npm ci $NPM_CI_ARGS
      shell: bash
      env:
        NPM_CI_ARGS: ${{ inputs['npm-ci-args'] }}
